stages:
  f2_validate_panel:
    cmd: python scripts/run_all_models_n1_n2_n3.py
    deps:
      - data/output/municipios_comunidad_madrid_completo.json
      - scripts/run_all_models_n1_n2_n3.py
      - src/lodcore/config/__init__.py
      - src/lodcore/config/thresholds.py
      - src/lodcore/config/weights.py
      - src/lodcore/data/quality_gates.py
      - src/lodcore/data/pointintime.py
      - src/lodcore/data/provenance.py
      - src/lodcore/models/base.py
      - src/lodcore/models/m1_avm/train.py
      - src/lodcore/models/m2_indicadores/train.py
      - src/lodcore/models/m2_indicadores/pca_subindices.py
      - src/lodcore/models/m2_indicadores/isocronas.py
      - src/lodcore/models/m3_demografia/train.py
      - src/lodcore/models/m3_demografia/project.py
      - src/lodcore/models/m4_capacidad/train.py
      - src/lodcore/models/m4_capacidad/reglas_no_compensatorias.py
      - src/lodcore/models/m5_recomendador/train.py
      - src/lodcore/explain/shap_to_json.py
      - src/lodcore/explain/redaccion_natural.py
      - src/lodcore/publish/uncertainty_band.py
    params:
      - params.yaml:
          - dataset
          - models
    outs:
      - data/processed/municipios_integrado_f2.csv
      - data/validated/municipios_panel_validado.csv
      - data/output/municipios_completo_ml.csv
      - src/lodcore/models/m1_avm/model.joblib
      - src/lodcore/models/m1_avm/model.onnx
      - src/lodcore/models/m3_demografia/projections_2030_2035.json
      - src/lodcore/models/m4_capacidad/model.joblib
      - src/lodcore/models/m4_capacidad/model.onnx
      - src/lodcore/models/m4_capacidad/shap_background.json
      - src/lodcore/models/m5_recomendador/clustering.json
      - oracle/onnx/m1_avm.onnx
      - oracle/onnx/m4_capacidad.onnx
    metrics:
      - src/lodcore/models/m1_avm/metrics.json:
          cache: false
      - src/lodcore/models/m2_indicadores/metrics.json:
          cache: false
      - src/lodcore/models/m3_demografia/metrics.json:
          cache: false
      - src/lodcore/models/m4_capacidad/metrics.json:
          cache: false
      - src/lodcore/models/m5_recomendador/metrics.json:
          cache: false
